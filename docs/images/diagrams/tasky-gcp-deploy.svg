<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 615" role="img" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>@font-face{font-family:'Inter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}</style>
<title>Tasky deployment pipeline: source pushed on GitHub triggers Terraform, which provisions a GKE cluster on GCP behind a load balancer, backed by MongoDB on a VM with daily backups to object storage.</title>
<defs>
<marker id="arrowhead-tasky-gcp-deploy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
</marker>
</defs>

<!-- Boundaries -->
<rect x="395" y="20" width="480" height="170" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="413" y="46" fill="#94a3b8" font-size="14" font-weight="600">GitHub</text>

<rect x="250" y="230" width="770" height="360" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="270" y="266" fill="#94a3b8" font-size="14" font-weight="600">Google Cloud Platform</text>

<rect x="470" y="274" width="300" height="250" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="490" y="300" fill="#fbbf24" font-size="14" font-weight="600">Private subnet</text>

<rect x="490" y="319" width="260" height="180" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="510" y="345" fill="#34d399" font-size="14" font-weight="600">GKE cluster</text>

<rect x="810" y="274" width="190" height="180" rx="12" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="830" y="300" fill="#fb7185" font-size="14" font-weight="600">Public subnet</text>

<!-- Arrows -->
<!-- push -->
<path d="M 595 109 L 665 109" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-tasky-gcp-deploy)"/>
<text x="630" y="99" fill="#94a3b8" font-size="13" text-anchor="middle">push</text>

<!-- provisions -->
<path d="M 760 142 L 760 270 C 760 300 700 287 700 317" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-tasky-gcp-deploy)"/>
<text x="745" y="215" fill="#94a3b8" font-size="13" text-anchor="end">provisions</text>

<!-- internet -> load balancer -->
<path d="M 170 402 L 270 402" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-tasky-gcp-deploy)"/>

<!-- load balancer -> tasky app -->
<path d="M 420 402 L 528 402" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-tasky-gcp-deploy)"/>

<!-- tasky app -> mongodb vm -->
<path d="M 690 402 L 823 402" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-tasky-gcp-deploy)"/>

<!-- mongodb vm -> bucket -->
<path d="M 905 435 L 905 502" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-tasky-gcp-deploy)"/>
<text x="960" y="473" fill="#94a3b8" font-size="13" text-anchor="middle">daily backups</text>

<!-- Components -->
<rect x="415" y="76" width="180" height="66" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="505" y="103" fill="white" font-size="15" font-weight="600" text-anchor="middle">tasky-project-demo</text>
<text x="505" y="126" fill="#94a3b8" font-size="13" text-anchor="middle">source + K8s manifests</text>

<rect x="665" y="76" width="190" height="66" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="760" y="103" fill="white" font-size="15" font-weight="600" text-anchor="middle">Terraform</text>
<text x="760" y="126" fill="#94a3b8" font-size="13" text-anchor="middle">via GitHub Actions</text>

<rect x="20" y="369" width="150" height="66" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="95" y="396" fill="white" font-size="15" font-weight="600" text-anchor="middle">Internet</text>
<text x="95" y="419" fill="#94a3b8" font-size="13" text-anchor="middle">external users</text>

<rect x="270" y="369" width="150" height="66" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="345" y="396" fill="white" font-size="15" font-weight="600" text-anchor="middle">Load balancer</text>
<text x="345" y="419" fill="#94a3b8" font-size="13" text-anchor="middle">GCP LB</text>

<rect x="530" y="369" width="160" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="610" y="396" fill="white" font-size="15" font-weight="600" text-anchor="middle">"tasky"</text>
<text x="610" y="419" fill="#94a3b8" font-size="13" text-anchor="middle">containerized app</text>

<rect x="825" y="369" width="160" height="66" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="905" y="396" fill="white" font-size="15" font-weight="600" text-anchor="middle">MongoDB</text>
<text x="905" y="419" fill="#94a3b8" font-size="13" text-anchor="middle">on Ubuntu VM</text>

<rect x="825" y="504" width="160" height="66" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="905" y="531" fill="white" font-size="15" font-weight="600" text-anchor="middle">Object storage</text>
<text x="905" y="554" fill="#94a3b8" font-size="13" text-anchor="middle">bucket</text>

</svg>
