<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400"
     font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace">

  <!-- ===================================================================
       Homelab Architecture
       Standalone SVG. Transparent background — assumes a dark surface.
       Boxes 160x66 (170 where the label needs it).
       =================================================================== -->

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===================================================================
       BOUNDARIES
       =================================================================== -->

  <!-- Home network -->
  <rect x="230" y="25" width="650" height="356" rx="12" fill="none"
        stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="248" y="51" fill="#fbbf24" font-size="14" font-weight="600">Home Network</text>

  <!-- Homelab (nested inside the home network) -->
  <rect x="460" y="105" width="400" height="256" rx="12" fill="none"
        stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="478" y="131" fill="#34d399" font-size="14" font-weight="600">Homelab</text>

  <!-- ===================================================================
       ARROWS — drawn before components, routed edge-to-edge
       =================================================================== -->

  <!-- External players in through the router -->
  <path d="M 192 223 L 213 223 Q 225 223 225 211 L 225 200 Q 225 188 237 188 L 248 188"
        fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Forwarded traffic: router -> gaming server, routed over the top -->
  <path d="M 330 153 L 330 95 Q 330 80 345 80 L 745 80 Q 760 80 760 95 L 760 153"
        fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="545" y="72" fill="#fbbf24" font-size="13" text-anchor="middle">forwarded traffic</text>

  <!-- DNS lookups from the workstation to Pi-hole -->
  <path d="M 412 291 L 433 291 Q 445 291 445 279 L 445 200 Q 445 188 457 188 L 478 188"
        fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="438" y="250" fill="#94a3b8" font-size="13" text-anchor="end">DNS lookup</text>

  <!-- Admin SSH session -->
  <line x1="412" y1="325" x2="573" y2="325" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="478" y="317" fill="#94a3b8" font-size="13">SSH</text>

  <!-- Host relationships -->
  <line x1="600" y1="273" x2="562" y2="224" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="555" y="255" fill="#94a3b8" font-size="13" text-anchor="end">hosts</text>

  <line x1="720" y1="273" x2="758" y2="224" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="768" y="255" fill="#94a3b8" font-size="13">hosts</text>

  <!-- ===================================================================
       COMPONENTS — title + one sublabel each
       =================================================================== -->

  <!-- External / generic -->
  <rect x="20" y="190" width="170" height="66" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="217" fill="white" font-size="15" font-weight="600" text-anchor="middle">External Players</text>
  <text x="105" y="240" fill="#94a3b8" font-size="13" text-anchor="middle">Internet</text>

  <!-- Network edge -->
  <rect x="250" y="155" width="160" height="66" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="330" y="182" fill="white" font-size="15" font-weight="600" text-anchor="middle">Router</text>
  <text x="330" y="205" fill="#94a3b8" font-size="13" text-anchor="middle">Exposed port</text>

  <!-- Client / workstation -->
  <rect x="250" y="275" width="160" height="66" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="302" fill="white" font-size="15" font-weight="600" text-anchor="middle">Personal PC</text>
  <text x="330" y="325" fill="#94a3b8" font-size="13" text-anchor="middle">Admin workstation</text>

  <!-- Containers -->
  <rect x="480" y="155" width="160" height="66" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="560" y="182" fill="white" font-size="15" font-weight="600" text-anchor="middle">Pi-hole Server</text>
  <text x="560" y="205" fill="#94a3b8" font-size="13" text-anchor="middle">Docker container</text>

  <rect x="680" y="155" width="160" height="66" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="760" y="182" fill="white" font-size="15" font-weight="600" text-anchor="middle">Gaming Server</text>
  <text x="760" y="205" fill="#94a3b8" font-size="13" text-anchor="middle">Docker container</text>

  <!-- Bare-metal host -->
  <rect x="575" y="275" width="170" height="66" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="660" y="302" fill="white" font-size="15" font-weight="600" text-anchor="middle">Headless Server</text>
  <text x="660" y="325" fill="#94a3b8" font-size="13" text-anchor="middle">Ubuntu LTS 26.04</text>

</svg>
