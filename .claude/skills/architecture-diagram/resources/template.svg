<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 450" role="img"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>[PROJECT NAME] architecture</title>

  <!-- Authored dark on transparent; the site inverts for light mode.
       Icons are referenced by path and embedded by build.py. -->

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- BOUNDARIES -->
  <rect x="220" y="140" width="810" height="282" rx="12" fill="none"
        stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="238" y="166" fill="#fbbf24" font-size="14" font-weight="600">AWS Region: us-west-2</text>

  <rect x="425" y="158" width="190" height="104" rx="8" fill="none"
        stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="437" y="177" fill="#fb7185" font-size="12">sg-public :443</text>

  <!-- ARROWS (before components, edge-to-edge, stopping ~2px short) -->
  <line x1="182" y1="213" x2="238" y2="213" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="210" y="203" fill="#94a3b8" font-size="13" text-anchor="middle">HTTPS</text>
  <line x1="402" y1="213" x2="438" y2="213" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="602" y1="213" x2="638" y2="213" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="802" y1="213" x2="838" y2="213" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="820" y="203" fill="#94a3b8" font-size="13" text-anchor="middle">TLS</text>
  <line x1="320" y1="248" x2="320" y2="334" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="334" y="296" fill="#94a3b8" font-size="13">static</text>
  <line x1="720" y1="248" x2="720" y2="277" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="305" x2="720" y2="334" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 182 63 L 700 63 Q 720 63 720 83 L 720 178" fill="none"
        stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="400" y="53" fill="#fb7185" font-size="12">OIDC / JWT</text>

  <!-- COMPONENTS: title + ONE sublabel. Baselines y+27 and y+50. -->
  <rect x="20" y="30" width="160" height="66" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="100" y="57" fill="white" font-size="15" font-weight="600" text-anchor="middle">Auth Provider</text>
  <text x="100" y="80" fill="#94a3b8" font-size="13" text-anchor="middle">OAuth 2.0</text>

  <rect x="20" y="180" width="160" height="66" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="207" fill="white" font-size="15" font-weight="600" text-anchor="middle">Users</text>
  <text x="100" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">Browser / Mobile</text>

  <rect x="240" y="180" width="160" height="66" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="320" y="207" fill="white" font-size="15" font-weight="600" text-anchor="middle">CloudFront</text>
  <text x="320" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">CDN</text>

  <rect x="440" y="180" width="160" height="66" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="520" y="207" fill="white" font-size="15" font-weight="600" text-anchor="middle">Load Balancer</text>
  <text x="520" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">ALB :443</text>

  <rect x="640" y="180" width="160" height="66" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="720" y="207" fill="white" font-size="15" font-weight="600" text-anchor="middle">API Server</text>
  <text x="720" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">FastAPI :8000</text>

  <rect x="840" y="180" width="170" height="66" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="925" y="207" fill="white" font-size="15" font-weight="600" text-anchor="middle">Database</text>
  <text x="925" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">PostgreSQL</text>

  <rect x="635" y="279" width="170" height="24" rx="4" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1"/>
  <text x="720" y="295" fill="#fb923c" font-size="11" text-anchor="middle">Kafka / RabbitMQ</text>

  <rect x="240" y="336" width="160" height="66" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="363" fill="white" font-size="15" font-weight="600" text-anchor="middle">Frontend</text>
  <text x="320" y="386" fill="#94a3b8" font-size="13" text-anchor="middle">React + TypeScript</text>

  <rect x="640" y="336" width="160" height="66" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="720" y="363" fill="white" font-size="15" font-weight="600" text-anchor="middle">Worker</text>
  <text x="720" y="386" fill="#94a3b8" font-size="13" text-anchor="middle">Celery</text>
</svg>
