use_directory_urls: true
site_name: Brett Studer
site_url: https://brstuder.github.io/portfolio/
theme:
  name: material
  logo: images/brett-icon-dark.svg
  font:
    text: Lato
    code: Roboto Mono
  favicon: images/brett-icon.svg
  palette:
    - scheme: slate #dark mode scheme
      primary: '#3fb055' #mkdocs only allows for default colors (ie `green`) so primary color is technically defined in CSS
      accent: light green
      toggle:
        icon: material/lightbulb #light/dark mode button
        name: Switch to dark mode
    - scheme: default #light mode scheme
      primary: '#3fb055'
      accent: light green
      toggle:
        icon: material/lightbulb-outline #light/dark mode button
        name: Switch to dark mode
  features:
    - navigation.top           # "Back to top" button
    - navigation.footer        # Previous/next page links
    - content.code.copy        # Copy button for code blocks
    - content.code.annotate    # Enable code annotations

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.extra
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # yaml-language-server-disable Unresolved tag
          format: !!python/name:pymdownx.superfences.fence_code_format
    # Content organization
  - pymdownx.tabbed:
      alternate_style: true
  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - def_list
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page

extra_css:
  - stylesheets/style.css

plugins:
  - search    #includes a search bar at the top of the page
  - callouts  #used for adding context-specific note blocks into my content
  - tags      #better cataloguing of all content

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/bstuder1
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/brstuder
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:brstuder1@gmail.com
      name: Email
  analytics:
    provider: google
    property: G-YKJRPETLZ6

nav:
  - About Me: index.md
  - Portfolio: portfolio.md
  - Experience: experience.md
  - Roles:
      - Improving Docs Workflows with AI at Arine: roles/arine.md
      - Leading Docs Strategy at Kubecost: roles/kubecost.md
      - Docs and Multimedia at MobiledgeX: roles/mobiledgex.md
      - OpenMRS Fellowship for Google Season of Docs: roles/openmrs.md
      - AbbVie Innovation Center Internship: roles/abbvie.md
  - Projects:
      - Quality-Gating My Own Portfolio: projects/portfolio-infrastructure.md
      - Full-Stack App Deployment with GCP: projects/app-deployment.md
      - Bird-Boy Project Showcase: projects/bird-boy.md

