name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-callouts
      - run: mkdocs build --site-dir site
      # PR previews (pr-preview.yml) commit into gh-pages under pr-preview/.
      # mkdocs gh-deploy fully replaces the branch on every push and would
      # wipe those out, so this deploys via github-pages-deploy-action with
      # clean-exclude instead, preserving anything under pr-preview/.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          clean-exclude: |
            pr-preview