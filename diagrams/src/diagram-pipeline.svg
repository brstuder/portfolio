<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Architecture diagram pipeline, mockup-driven workflow</title>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- BOUNDARIES -->
  <rect x="350" y="60" width="480" height="330" rx="12" fill="none"
        stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="368" y="86" fill="#94a3b8" font-size="14" font-weight="600">Mkdocs Project Files</text>

  <!-- ARROWS -->
  <line x1="190" y1="143" x2="468" y2="143" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="330" y="133" fill="#94a3b8" font-size="13" text-anchor="middle">Queries Claude</text>

  <path d="M 110 176 L 110 305 Q 110 313 118 313 L 388 313" fill="none"
        stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="250" y="303" fill="#94a3b8" font-size="13" text-anchor="middle">adds to /diagrams/inbox</text>

  <path d="M 470 280 L 470 220 Q 470 212 478 212 L 522 212 Q 530 212 530 204 L 530 178" fill="none"
        stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <path d="M 570 178 L 570 220 Q 570 228 578 228 L 682 228 Q 690 228 690 236 L 690 278" fill="none"
        stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <line x1="770" y1="313" x2="908" y2="313" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- COMPONENTS -->
  <rect x="30" y="110" width="160" height="66" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="149" fill="white" font-size="15" font-weight="600" text-anchor="middle">Technical Writer</text>

  <rect x="470" y="110" width="160" height="66" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="550" y="137" fill="white" font-size="15" font-weight="600" text-anchor="middle">Claude</text>
  <text x="550" y="160" fill="#94a3b8" font-size="13" text-anchor="middle">SKILL.md</text>

  <rect x="390" y="280" width="160" height="66" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="307" fill="white" font-size="15" font-weight="600" text-anchor="middle">Input</text>
  <text x="470" y="330" fill="#94a3b8" font-size="13" text-anchor="middle">PNG</text>

  <rect x="610" y="280" width="160" height="66" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="690" y="307" fill="white" font-size="15" font-weight="600" text-anchor="middle">Output</text>
  <text x="690" y="330" fill="#94a3b8" font-size="13" text-anchor="middle">SVG</text>

  <rect x="910" y="280" width="160" height="66" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="990" y="319" fill="white" font-size="15" font-weight="600" text-anchor="middle">Portfolio Webpage</text>
</svg>
